<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0172D4">
    <title>Sem ligação | Lava Já Smart</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f4faff;color:#102a43;font-family:Arial,Helvetica,sans-serif}.card{width:min(440px,100%);padding:32px;border:1px solid #d8e8f3;border-radius:22px;background:#fff;text-align:center;box-shadow:0 16px 50px #102a4312}.logo{width:min(210px,80%);height:auto;margin-bottom:24px}.mark{display:grid;width:56px;height:56px;margin:0 auto 18px;place-items:center;border-radius:18px;background:#e8f8ff;color:#0172d4;font-size:26px}.card h1{margin:0 0 10px;font-size:25px;letter-spacing:-.04em}.card p{margin:0;color:#526b81;font-size:14px;line-height:1.6}.hint{margin-top:18px!important;font-size:12px!important}.link{display:inline-flex;min-height:44px;align-items:center;justify-content:center;margin-top:22px;padding:0 18px;border-radius:11px;background:#0172d4;color:#fff;font-size:13px;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/brand/lava-ja-horizontal.svg" alt="Lava Já Smart">
      <div class="mark" aria-hidden="true">⌁</div>
      <h1>Sem ligação à internet</h1>
      <p>Não foi possível abrir esta página agora. Volte a ligar-se à internet e tente novamente.</p>
      <p class="hint">Por segurança, marcações, estados e operações demonstrativas não ficam disponíveis offline.</p>
      <a class="link" href="/">Tentar novamente</a>
    </main>
  </body>
</html>
